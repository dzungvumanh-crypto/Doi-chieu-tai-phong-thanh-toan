[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Ma du an goi API bi bo -> test do ngay, khong lan vao hang nghin canh bao cua thu vien (#113).
# Khop theo module NOI GOI: canh bao cua thu vien dung stacklevel (pandas, pydantic,
# lunardate) tro ve dong goi trong backend/ -> cung do. Nang thu vien khong ghim
# (pydantic di kem fastapi) ma CI do o day la tin hieu that, khong phai CI hong.
filterwarnings =
    error::DeprecationWarning:backend
    error::DeprecationWarning:frontend
