[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Ma du an goi API bi bo -> test do ngay, khong lan vao hang nghin canh bao cua thu vien (#113).
# Chi khop canh bao quy ve module backend/frontend; canh bao sinh trong thu vien khong tinh.
filterwarnings =
    error::DeprecationWarning:backend
    error::DeprecationWarning:frontend
