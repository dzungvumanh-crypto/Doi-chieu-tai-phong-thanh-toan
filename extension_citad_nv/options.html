<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cấu hình Extension Đối chiếu CITAD - PaymentHub N&amp;V</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 32px auto; color: #1e293b; }
  h1 { font-size: 16px; margin-bottom: 4px; }
  p.hint { font-size: 12px; color: #64748b; margin-top: 0; }
  label { display: block; font-size: 13px; font-weight: bold; margin-top: 16px; margin-bottom: 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; font-size: 13px; }
  button { margin-top: 20px; background: #991b1b; color: #fff; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; }
  button:hover { background: #7f1d1d; }
  #status { margin-top: 12px; font-size: 13px; padding: 8px 12px; border-radius: 6px; display: none; }
  #status.ok { display: block; background: #dcfce7; color: #166534; }
  #status.err { display: block; background: #fee2e2; color: #991b1b; }
  #status.warn { display: block; background: #fef3c7; color: #92400e; }
</style>
</head>
<body>
  <h1>Cấu hình Extension — Đối chiếu CITAD - PaymentHub N&amp;V</h1>
  <p class="hint">
    Extension RIÊNG của Phòng QLTK Nostro, Vostro (không dùng chung với Extension của
    Phòng Thanh toán). Điền 1 lần, không cần sửa file. Lấy "Mã kết nối" từ trang
    <code>/doi_chieu_citad_nostro</code> trên web TTTT, mục "Kết nối Extension".
  </p>

  <label for="server">Địa chỉ backend TTTT (SERVER)</label>
  <input type="text" id="server" placeholder="https://backend.tttt.noi-bo/  (hoặc http://localhost:8000 khi test)">

  <label for="token">Mã kết nối (Extension Token)</label>
  <input type="text" id="token" placeholder="Dán mã đã sao chép từ /doi_chieu_citad_nostro">

  <button id="save">Lưu cấu hình</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
