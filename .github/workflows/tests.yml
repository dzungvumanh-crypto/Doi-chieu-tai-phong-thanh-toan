# Chạy ruff + pytest cho pull request vào develop (và chạy tay khi cần).
#
# Vì sao KHÔNG chạy theo push nữa (11/09/2026): mỗi lần push từng chạy HAI lượt
# (push + pull_request) trên cùng nội dung, và merge xong lại thêm một lượt push
# develop — kiểm lại đúng thứ PR vừa kiểm. Windows bị tính gấp đôi phút, quota
# gói Free cạn và GitHub chặn job giữa lúc đang mở PR. Nay: 1 lượt mỗi lần cập
# nhật PR, 0 lượt khi merge. Đẩy thẳng lên develop (không qua PR) thì KHÔNG có CI
# — muốn kiểm thì bấm "Run workflow" (workflow_dispatch) hoặc chạy tại máy.
#
# Vì sao windows-latest chứ không phải ubuntu (rẻ và nhanh hơn): dự án chỉ chạy
# trên Windows. Tên thư mục template tiếng Việt ở dạng NFD và `tests/test_paths.py`
# canh đúng hành vi không chuẩn hoá của Windows — chạy trên Linux là kiểm sai môi
# trường thật, xanh hay đỏ đều không nói lên điều gì.
#
# Python 3.12 cố định: README và CONTRIBUTING ghi rõ máy mới cần đúng 3.12.x, bản
# khác buộc cài lại toàn bộ thư viện. Ghim ở đây phải khớp hai file đó — lệch là
# đồng đội chạy thứ CI không kiểm (đã xảy ra: PR #105).
name: Tests

on:
  pull_request:
    branches: [develop]
    # PR chỉ sửa tài liệu thì bỏ qua. PR sửa cả mã lẫn tài liệu vẫn chạy — bỏ qua
    # chỉ xảy ra khi MỌI file đổi đều khớp các mẫu dưới.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Đẩy thêm commit vào PR đang chạy CI thì huỷ lượt cũ — nó kiểm mã đã lỗi thời.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Mặc định khoá cache chỉ theo requirements.txt — sửa requirements-dev.txt
          # (thêm ruff, pytest-cov) sẽ không làm mới cache.
          cache-dependency-path: requirements*.txt

      - name: Cài thư viện
        id: cai
        # requirements-dev.txt = requirements.txt + pytest, pytest-cov, ruff. Ba
        # thứ đó KHÔNG nằm trong requirements.txt: file đó được `deploy.bat` pip
        # install trên máy chính, không cần công cụ phát triển ở đó.
        run: pip install -r requirements-dev.txt

      # Cổng đỏ — tên chưa định nghĩa / dùng biến trước khi gán / lỗi cú pháp.
      # Test xanh không bắt được các lỗi này khi chúng nằm trên nhánh không test nào
      # đi qua: 2 lỗi thật đã lọt develop như vậy (docs/DESIGN.md, mục "Lỗi tên
      # chưa định nghĩa"). Cấu hình và lý do chọn luật: ruff.toml.
      # CI đỏ KHÔNG tự khoá nút Merge (repo riêng tư gói Free không bật được bảo vệ
      # nhánh) — quy trình bù: `gh pr checks` xanh hết mới merge (docs/SKILL.md).
      - name: Ruff — cổng đỏ (F821, F823, E9)
        run: python -m ruff check . --select F821,F823,E9

      # Các bước dưới vẫn chạy khi cổng ruff đỏ — một lượt CI thấy đủ mọi kết quả —
      # nhưng KHÔNG chạy khi bước cài hỏng, để lỗi gốc không bị ba bước đỏ theo che lấp.
      - name: Ruff — báo cáo (không làm đỏ CI)
        if: ${{ !cancelled() && steps.cai.outcome == 'success' }}
        run: python -m ruff check . --exit-zero --statistics

      - name: Chạy pytest
        if: ${{ !cancelled() && steps.cai.outcome == 'success' }}
        env:
          # backend/core/config.py raise ngay khi khởi động nếu thiếu biến này.
          # Giá trị chỉ dùng cho lần chạy test, không phải khoá thật.
          SECRET_KEY: ci-chi-dung-de-chay-test-khong-phai-khoa-that
          # Tắt gọi NTP: runner không cần, và tránh test treo khi mạng chặn UDP 123.
          NTP_ENABLED: "false"
          # Mật khẩu ZIP nay đọc từ .env (không còn nằm cứng trong mã). Runner
          # không có .env — test tự nén file mẫu bằng đúng giá trị này rồi giải
          # nén lại, nên giá trị gì cũng được, miễn có đặt.
          DOI_CHIEU_ZIP_PASSWORD: ci-mat-khau-zip-gia-lap
          PYTHONIOENCODING: utf-8
        # Đo phủ ở chế độ báo cáo, chưa đặt ngưỡng — xem Implementation-notes card CI1.
        run: python -m pytest -q --cov=backend --cov=frontend --cov-report=term:skip-covered
