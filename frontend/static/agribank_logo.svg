<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="c">
      <rect x="2" y="2" width="96" height="96" rx="13"/>
    </clipPath>
  </defs>

  <!-- White outer rounded background -->
  <rect width="100" height="100" rx="15" fill="white"/>

  <!-- Dark green fill (base layer, entire inner area) -->
  <rect x="2" y="2" width="96" height="96" rx="13" fill="#1A5C2A"/>

  <!-- Dark red/crimson diagonal band  (x+y between 58 and 142) -->
  <polygon points="56,2 98,2 98,44 44,98 2,98 2,56"
           fill="#8B1A2C" clip-path="url(#c)"/>

  <!-- White dividing line 1  (x+y = 58, upper/left edge of band) -->
  <line x1="56" y1="2"  x2="2"  y2="56"
        stroke="white" stroke-width="3.5" stroke-linecap="round" clip-path="url(#c)"/>

  <!-- White dividing line 2  (x+y = 142, lower/right edge of band) -->
  <line x1="98" y1="44" x2="44" y2="98"
        stroke="white" stroke-width="3.5" stroke-linecap="round" clip-path="url(#c)"/>

  <!-- ── Gold braid (6 leaf shapes along central axis x+y=100) ──────────── -->
  <!-- Positions evenly spaced from (78,22) to (22,78)                      -->
  <!-- Type B  = rotated -75° (behind/darker)                               -->
  <!-- Type A  = rotated -15° (front/lighter)                               -->

  <!-- Draw B leaves first (they go behind A leaves) -->
  <ellipse cx="67" cy="33" rx="5.5" ry="13.5"
           fill="#C09528" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-75 67 33)" clip-path="url(#c)"/>
  <ellipse cx="45" cy="55" rx="5.5" ry="13.5"
           fill="#C09528" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-75 45 55)" clip-path="url(#c)"/>
  <ellipse cx="23" cy="77" rx="5.5" ry="13.5"
           fill="#C09528" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-75 23 77)" clip-path="url(#c)"/>

  <!-- Draw A leaves on top (lighter gold) -->
  <ellipse cx="78" cy="22" rx="5.5" ry="13.5"
           fill="#E0C040" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-15 78 22)" clip-path="url(#c)"/>
  <ellipse cx="56" cy="44" rx="5.5" ry="13.5"
           fill="#E0C040" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-15 56 44)" clip-path="url(#c)"/>
  <ellipse cx="34" cy="66" rx="5.5" ry="13.5"
           fill="#E0C040" stroke="#7A6010" stroke-width="0.8"
           transform="rotate(-15 34 66)" clip-path="url(#c)"/>
</svg>
